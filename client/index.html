<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login | CAHCET Leave System</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body class="auth-page">
    <header class="inst-header-login">
        <div class="header-container" style="justify-content: center;">
            <div class="inst-header-text centered">
                <h1>C ABDUL HAKEEM COLLEGE OF ENGINEERING & TECHNOLOGY</h1>
                <p>Approved by AICTE | Affiliated to Anna University | NBA Accredited</p>
            </div>
        </div>
    </header>

    <div class="auth-container">
        <div class="glass-card">
            <div class="login-header">
                <h2>Faculty Login</h2>
                <p>Sign in to the CAHCET Leave System</p>
            </div>
            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter your username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Enter your password"
                        autocomplete="current-password" required>
                </div>
                <div class="form-footer-actions">
                    <label class="checkbox-container">
                        <input type="checkbox" name="remember">
                        <span class="checkmark"></span>
                        Remember me
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary">Log In</button>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <footer class="inst-footer">
        <p>&copy; 2024 C Abdul Hakeem College of Engineering and Technology. All rights reserved.</p>
    </footer>

    <script type="module">
        import { login } from './js/app.js';

        const form = document.getElementById('loginForm');
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const username = formData.get('username');
                const password = formData.get('password');

                const btn = e.target.querySelector('button');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';
                btn.disabled = true;

                try {
                    await login(username, password);
                } catch (err) {
                    btn.innerHTML = 'Log In';
                    btn.disabled = false;
                    if (window.showToast) {
                        window.showToast('Login failed. Please check your credentials.', 'error');
                    } else {
                        alert('Login failed. Please check your credentials.');
                    }
                }
            });
        }
    </script>
</body>

</html>
