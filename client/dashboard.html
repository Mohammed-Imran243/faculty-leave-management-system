<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CAHCET | Leave Management System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
</head>

<body class="dashboard-page">
    <div class="dashboard-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand"
                    style="border-left: 4px solid var(--primary); padding-left: 12px; display: flex; align-items: center; gap: 10px;">
                    <i class="fas fa-graduation-cap" style="font-size: 1.5rem; color: #1e3a8a;"></i>
                    <div>
                        <span
                            style="font-weight: 800; color: #1e3a8a; font-size: 1.25rem; line-height: 1.2;">CAHCET</span>
                        <small style="display: block; color: var(--sidebar-text); font-size: 0.75rem;">Leave
                            System</small>
                    </div>
                </div>
            </div>

            <nav class="sidebar-menu" id="sidebar-menu">
            </nav>

            <div class="sidebar-footer">
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Sign Out</span>
                </button>
            </div>
        </aside>

        <div class="sidebar-overlay" id="sidebar-overlay"></div>

        <main class="main-wrapper">
            <header class="top-header">
                <div class="header-left">
                    <button id="sidebar-toggle" class="sidebar-toggle" onclick="
                        var s=document.getElementById('sidebar');
                        var o=document.getElementById('sidebar-overlay');
                        s.classList.toggle('active');
                        o.classList.toggle('active');
                    ">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 id="current-view-title">Dashboard</h2>
                </div>

                <div class="header-right">
                    <div class="notif-wrapper">
                        <button class="notif-btn" onclick="toggleNotifications()">
                            <i class="far fa-bell"></i>
                            <span class="notif-badge" id="notif-badge">0</span>
                        </button>
                        <div class="notif-dropdown" id="notif-dropdown">
                            <div class="notif-header">Notifications</div>
                            <div id="notif-list" class="notif-list">
                            </div>
                        </div>
                    </div>

                    <div class="user-info">
                        <div class="user-text">
                            <span id="user-name" class="user-name">...</span>
                            <span id="user-role" class="user-role">...</span>
                        </div>
                        <div class="user-avatar">
                            <i class="fas fa-user-circle" style="font-size: 2rem; color: #4f46e5;"></i>
                        </div>
                    </div>
                </div>
            </header>

            <div class="container">
                <div class="inst-header">
                    <div class="inst-header-text">
                        <h1>C ABDUL HAKEEM COLLEGE OF ENGINEERING & TECHNOLOGY</h1>
                        <p>Approved by AICTE | Affiliated to Anna University | NBA Accredited</p>
                    </div>
                </div>

                <div id="content-area" class="main-content">
                </div>
            </div>

            <footer class="dashboard-footer">
                <p>&copy; 2024 C Abdul Hakeem College of Engineering and Technology.</p>
            </footer>
        </main>
    </div>

    <div id="createUserModal" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="userModalTitle">Create New User</h3>
                <button onclick="hideCreateUserModal()">&times;</button>
            </div>
            <form id="userForm" onsubmit="handleCreateUser(event)">
                <input type="hidden" name="userId" id="editUserId">
                <input type="hidden" name="mode" id="formMode" value="create">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Employee Code</label>
                        <input type="text" name="employee_code" id="employee_code" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" name="name" id="user_name_input" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" name="username" id="username_input" class="form-control" required autocomplete="off">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" name="password" id="password_input" class="form-control"
                            autocomplete="new-password">
                        <small id="passwordHelp" class="text-muted" style="display:none;">Leave blank to keep current password</small>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select name="role" id="role_input" class="form-control" required>
                            <option value="Assistant Professor (AP)">Assistant Professor (AP)</option>
                            <option value="Associate Professor">Associate Professor</option>
                            <option value="Professor">Professor</option>
                            <option value="HOD">HOD</option>
                            <option value="Principal">Principal</option>
                            <option value="Officer">Officer</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Department</label>
                        <input type="text" name="department" id="department_input" class="form-control" placeholder="e.g. CSE">
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" onclick="hideCreateUserModal()">Cancel</button>
                    <button type="submit" id="userSubmitBtn" class="btn btn-primary">Create User</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <script src="js/app.js" type="module"></script>
    <script>
        window.addEventListener('load', () => {
            if (window.initDashboard) window.initDashboard();
        });
    </script>
</body>

</html>
